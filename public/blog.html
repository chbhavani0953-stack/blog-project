<!DOCTYPE html>
<html>
<head>
  <title>My Website - Blog</title>
    <link rel="stylesheet" href="blog.css">
</head>
<body>
  <nav>
    <a href="index.html">Home</a> |
    <a href="blog.html">Blog</a>
  </nav>
  <h1>My Blog</h1>
  <article>
    <h2>First Blog Post</h2>
    <p>This is my first blog post. More content will be added soon!</p>
  </article>
  <form id="blogForm">
  <label for="name">Name:</label>
  <input type="text" id="name" placeholder="Enter your name">

  <label for="email">Email:</label>
  <input type="email" id="email" placeholder="Enter your email">

  <label for="title">Blog Title:</label>
  <input type="text" id="title" placeholder="Enter blog title">

  <label for="content">Blog Content:</label>
  <textarea id="content" placeholder="Write your blog here"></textarea>

  <button type="submit">Add Blog</button>
</form>
  <h2>All Blog Posts</h2>
  <div id="blogList"></div>

  <footer>
    <p>&copy; 2026 My Website | All Rights Reserved</p>
  </footer>
  <script src="blog.js" defer></script>
</body>
</html>
